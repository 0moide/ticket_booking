version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: cinema_db
    environment:
      POSTGRES_DB: cinema
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5545:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: